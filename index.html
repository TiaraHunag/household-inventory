@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

.app {
  --bg: #ECE8DF;
  --surface: #FFFFFF;
  --ink: #2B2E27;
  --ink-soft: #6B6E64;
  --accent: #C89B2C;
  --accent-2: #5B7C8D;
  --danger: #B5453D;
  --warn: #C89B2C;
  --line: #DFD9CB;
  --in: #5B7C6A;
  --out: #B5453D;

  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100%;
  padding: 20px 16px 100px;
  box-sizing: border-box;
  position: relative;
}
.app * { box-sizing: border-box; }
.loading { text-align: center; padding: 40px; color: var(--ink-soft); }
.conn-error {
  text-align: center; padding: 60px 20px; display: flex; flex-direction: column;
  align-items: center; gap: 14px;
}
.conn-error p { font-size: 13px; color: var(--ink-soft); line-height: 1.7; max-width: 320px; }

.toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 100px;
  font-size: 13px; font-weight: 600; z-index: 50; box-shadow: 0 6px 16px rgba(0,0,0,0.25);
}

.header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
.brand-mark { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; display: block; line-height: 1; color: var(--ink); }
.brand-sub { font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; }
.stats { display: flex; gap: 16px; }
.stat { text-align: center; }
.stat-num { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; display: block; }
.warn-num { color: var(--danger); }
.stat-label { font-size: 10px; color: var(--ink-soft); letter-spacing: 1px; }

.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-soft); font-size: 13px; font-weight: 600;
  cursor: pointer; position: relative;
}
.tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab-count {
  background: var(--danger); color: white; font-size: 10px; font-family: 'JetBrains Mono', monospace;
  padding: 1px 6px; border-radius: 8px; margin-left: 2px;
}

.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-row.scroll { overflow-x: auto; flex-wrap: nowrap; margin-bottom: 14px; padding-bottom: 2px; }
.chip {
  white-space: nowrap; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-soft); font-size: 12px; cursor: pointer;
}
.chip-active { background: var(--accent-2); color: white; border-color: var(--accent-2); }
.chip-add { display: flex; align-items: center; gap: 3px; color: var(--accent-2); border-style: dashed; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--ink-soft); padding: 30px 0; font-size: 13px; }

.card {
  position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 4px 4px 10px 10px;
  padding: 16px 12px 10px; display: flex; flex-direction: column; gap: 8px;
}
.hole {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line);
}
.card-top { display: flex; justify-content: space-between; align-items: center; }
.tag { font-size: 10px; letter-spacing: 1px; color: var(--accent-2); font-weight: 700; text-transform: uppercase; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 100px; font-weight: 700; color: white; }
.badge.danger { background: var(--danger); }
.badge.warn { background: var(--warn); }

.name-btn {
  background: none; border: none; text-align: left; font-size: 16px; font-weight: 600; color: var(--ink);
  padding: 0; cursor: pointer; font-family: 'Inter', sans-serif;
}
.qty-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0; }
.step-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
}
.step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.qty-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; min-width: 46px; text-align: center; }
.unit { font-size: 11px; color: var(--ink-soft); margin-left: 3px; font-family: 'Inter', sans-serif; }

.price-note { font-size: 11px; color: var(--accent-2); font-weight: 600; text-align: center; }

.card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--line); padding-top: 6px; }
.threshold-note { font-size: 10px; color: var(--ink-soft); }
.footer-actions { display: flex; gap: 2px; }

.icon-btn { border: none; background: none; cursor: pointer; color: var(--ink-soft); padding: 4px; border-radius: 6px; }
.icon-btn.ghost:hover { background: var(--bg); color: var(--danger); }
.icon-btn.accent { background: var(--accent-2); color: white; flex-shrink: 0; }
.card-actions { display: flex; justify-content: flex-end; gap: 6px; }

.edit-grid { display: flex; flex-direction: column; gap: 10px; }
.edit-row { display: flex; gap: 6px; align-items: flex-end; }
.field-col { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.field-label { font-size: 10px; color: var(--ink-soft); font-weight: 700; letter-spacing: 0.5px; }
.field-hint { font-size: 10px; color: var(--ink-soft); line-height: 1.5; margin-top: -4px; }
.section-divider {
  font-size: 11px; font-weight: 700; color: var(--accent-2); text-transform: uppercase; letter-spacing: 1px;
  border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 2px;
}
.field {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); width: 100%;

.ledger-badge.out { background: var(--out); }

.ledger-list { display: flex; flex-direction: column; gap: 8px; }
.ledger-row {

.ledger-main { display: flex; flex-direction: column; flex: 1; gap: 2px; }
.ledger-name { font-size: 13px; font-weight: 700; }
.ledger-detail { font-size: 11px; color: var(--ink-soft); }

.fab-row {

  box-shadow: 0 6px 16px rgba(0,0,0,0.25); white-space: nowrap;
}
.fab.ghost-fab { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.add-panel {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 2px solid var(--ink);
  padding: 16px; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
  max-height: 75vh; overflow-y: auto;
}
.add-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.btn { border-radius: 100px; padding: 9px 18px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; }
.btn.ghost { background: var(--bg); color: var(--ink-soft); }
.btn.accent { background: var(--accent); color: white; }

.scanner-overlay {
  position: fixed; inset: 0; background: rgba(20, 22, 18, 0.85); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 16px;

.scanner-panel {
  background: var(--surface); border-radius: 16px; padding: 16px; width: 100%; max-width: 380px;
  display: flex; flex-direction: column; gap: 10px;
}
.scanner-panel.edit-modal { max-width: 420px; max-height: 85vh; overflow-y: auto; }
.scanner-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.scanner-view {
  position: relative; width: 100%; aspect-ratio: 4 / 3; background: #111; border-radius: 10px; overflow: hidden;
}
.scanner-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-line {
  position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.scanner-hint { font-size: 12px; color: var(--ink-soft); text-align: center; }
.scanner-error { font-size: 12px; color: var(--danger); text-align: center; }
.manual-row { display: flex; gap: 6px; align-items: center; }
