<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>居物櫃・日用品進銷存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5ead8; --surface:#ebddc5; --ink:#201e1d;
  --accent:#c67139; --accent-100:#fff2eb; --accent-200:#ffe1d0; --accent-300:#ffc6a5;
  --accent-400:#f6a06b; --accent-700:#8c491a; --accent-800:#643312;
  --sage:#7a8a5e; --sage-200:#e1eecc; --sage-700:#56633f; --sage-800:#3d472b;
  --n-200:#eee7db; --n-300:#dcd3c4; --n-400:#c0b6a5; --n-900:#2e2b25;
  --line:color-mix(in srgb,#201e1d 16%,transparent);
  --soft:rgba(32,30,29,.6); --softer:rgba(32,30,29,.5);
  --r-md:16px; --r-lg:28px;
  --sh-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --sh-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);
  --num:'Caprasimo',serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#root{min-height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}
a{color:var(--accent-700)}
svg{fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.num{font-family:var(--num)}
.app{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.head{flex:none;padding:14px 20px 10px}
.scroll{flex:1;overflow-y:auto;padding:0 20px 24px;-webkit-overflow-scrolling:touch}
.h1{font-size:23px;font-weight:900;line-height:1.2}
.kicker{font-family:var(--num);font-size:14px;letter-spacing:.12em;color:var(--accent-700)}
.lbl{font-size:12px;font-weight:700;color:var(--soft);margin:0 0 5px 4px}
.hint{font-size:12px;color:var(--soft);line-height:1.7;margin:6px 0 0 4px}
.inp{width:100%;min-height:46px;padding:11px 16px;font:inherit;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--ink)}
.inp:focus-visible{border-color:var(--accent);outline:none}
.pb{min-height:48px;border:0;border-radius:999px;background:var(--accent-700);color:var(--bg);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:0 18px}
.pb:hover{background:var(--accent-800)}
.pb:disabled{opacity:.45}
.sb{min-height:48px;border:1px solid var(--n-400);border-radius:999px;background:transparent;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:0 18px}
.sb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.danger{border-color:var(--accent-400);color:var(--accent-800)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{flex:none;padding:9px 15px;min-height:38px;border-radius:999px;background:var(--surface);border:0;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--n-300)}
.chip.on{background:var(--accent-700);color:var(--bg);font-weight:700}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.row1{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.row1::-webkit-scrollbar{height:0}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 16px;margin-top:13px}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;min-height:46px;color:var(--ink);outline:none}
.sect{font-size:12px;font-weight:700;margin:14px 0 8px 2px;display:flex;align-items:center;gap:6px}
.sect.low{color:var(--accent-800)}
.sect.ok{color:var(--softer)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;border-radius:var(--r-lg);padding:11px 12px;background:var(--surface)}
.row.low{background:var(--accent-100)}
.nm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.nm b{display:block;font-size:16px;font-weight:700}
.nm span{display:block;font-size:12px;color:var(--soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:48px;height:48px;flex:none;border-radius:999px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);background:var(--bg)}
.st.plus{border:0;background:var(--sage-700);color:var(--bg)}
.row.low .st{border-color:var(--accent-300);color:var(--accent-800)}
.row.low .st.plus{border:0;background:var(--accent-700);color:var(--bg)}
.st:disabled{opacity:.35;cursor:not-allowed}
.qty{min-width:34px;text-align:center}
.qty b{font-family:var(--num);font-size:23px;font-weight:400;display:block;line-height:1.1}
.row.low .qty b{color:var(--accent-800)}
.qty span{font-size:10px;color:var(--softer)}
.stats{display:flex;gap:14px;align-items:flex-end}
.stat{text-align:right}
.stat b{font-family:var(--num);font-size:20px;font-weight:400}
.stat span{display:block;font-size:10px;color:var(--softer)}
.stat.warn b,.stat.warn span{color:var(--accent-800)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px}
.card.tint{background:var(--accent-100)}
.meter{height:9px;border-radius:999px;background:var(--n-300);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--sage)}
.meter i.low{background:var(--accent)}
.meterx{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.empty{text-align:center;padding:56px 24px;color:var(--soft);font-size:14px;line-height:1.9}
.empty .num{font-size:40px;color:var(--sage-700);display:block}
.navb{flex:none;display:flex;align-items:flex-end;justify-content:space-around;padding:9px 10px calc(18px + env(safe-area-inset-bottom));background:var(--surface);border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);position:sticky;bottom:0}
.nvi{width:64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;font-size:11px;font-weight:700;color:var(--softer);position:relative}
.nvi.on{color:var(--accent-800)}
.nvi em{position:absolute;top:0;right:8px;font-family:var(--num);font-style:normal;background:var(--accent-700);color:var(--bg);font-size:10px;min-width:17px;padding:1px 4px;border-radius:999px;text-align:center}
.fab{width:58px;height:58px;border-radius:999px;border:0;background:var(--accent-700);color:var(--bg);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh-md);margin-bottom:4px}
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--n-900) 45%,transparent);display:flex;flex-direction:column;justify-content:flex-end}
.pane{background:var(--bg);border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);padding:8px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;box-shadow:var(--sh-lg)}
.grab{width:44px;height:5px;border-radius:999px;background:var(--n-400);margin:4px auto 12px;flex:none}
.pbody{overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;top:18px;left:0;right:0;display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast b{background:var(--n-900);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--sh-md)}
.dot{width:9px;height:9px;border-radius:999px;background:var(--n-300)}
.dot.on{background:var(--accent-700)}
.tx{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;border:0;width:100%;text-align:left;cursor:pointer}
.tx .ic{width:38px;height:38px;flex:none;border-radius:999px;display:grid;place-items:center;background:var(--accent-200);color:var(--accent-800)}
.tx.in .ic{background:var(--sage-200);color:var(--sage-800);transform:rotate(180deg)}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:15px;font-weight:700}
.tx .mid span{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.tx .amt{text-align:right}
.tx .amt b{font-family:var(--num);font-size:20px;font-weight:400;color:var(--accent-800)}
.tx.in .amt b{color:var(--sage-800)}
.tx .amt span{display:block;font-size:11px;color:var(--softer)}
.daylbl{font-size:12px;font-weight:700;color:var(--softer);margin:0 0 8px 2px}
.mark{width:30px;height:30px;flex:none;border-radius:999px;border:2px solid var(--accent-700);background:transparent;display:grid;place-items:center;cursor:pointer;margin-top:3px;color:var(--bg)}
.mark.on{background:var(--accent-700)}
.mark svg{opacity:0}
.mark.on svg{opacity:1}
.strike{text-decoration:line-through}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 28px 70px}
.logo{width:74px;height:74px;border-radius:999px;background:var(--accent-200);display:grid;place-items:center;color:var(--accent-800)}
.err{font-size:13px;font-weight:700;color:var(--accent-800);margin:8px 0 0 4px}
.ok{font-size:12px;font-weight:700;color:var(--sage-700);display:flex;align-items:center;gap:7px;margin:10px 0 0 4px}
.catrow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px}
.catrow b{flex:1;font-size:15px;font-weight:700}
.catrow span{font-size:12px;color:var(--soft)}
.ib{width:40px;height:40px;flex:none;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--soft)}
.ib:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sub .c2{display:inline-flex;flex:none;white-space:nowrap;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 13px;font-size:13px}
.sub .c2 button{border:0;background:none;cursor:pointer;color:var(--softer);display:grid;place-items:center;width:26px;height:26px;border-radius:999px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
var DEFAULT_URL = "https://script.google.com/macros/s/AKfycbwyyEyh2o1PCNd4D8bwCwmsAHpUiPGoC1yBcHl7B6fL5k-DSfCyNOexThFeXs5fQ7khIA/exec";
var CHANNELS = ["全聯","家樂福","好市多","蝦皮購物","其他"];
var UNITS = ["瓶","包","支","捲","盒","入","個"];
var DAY = 86400000;

/* ── icons ─────────────────────────────────────────── */
var I = {
  cab:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18"/><path d="M10 15h4"/>',
  minus:'<path d="M5 12h14"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/>',
  x:'<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  warn:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  cart:'<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/>',
  list:'<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/>',
  cog:'<path d="M4 21v-6"/><path d="M4 11V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1.5 14h5"/><path d="M9.5 8h5"/><path d="M17.5 16h5"/>',
  down:'<path d="M12 5v14"/><path d="m5 12 7 7 7-7"/>',
  bag:'<path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4z"/><path d="M4 6h16"/><path d="M9 10a3 3 0 0 0 6 0"/>',
  use:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  pen:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',
  chev:'<path d="m9 18 6-6-6-6"/>'
};
function svg(name, size){ return '<svg width="'+(size||20)+'" height="'+(size||20)+'" viewBox="0 0 24 24">'+I[name]+'</svg>'; }

/* ── helpers ───────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return "item_"+Date.now()+"_"+Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function stock(it){ return (it.transactions||[]).reduce(function(a,t){ return a + (t.type==="in" ? num(t.qty) : -num(t.qty)); },0); }
function isLow(it){ return stock(it) <= num(it.threshold); }
function fmtD(iso){ var d=new Date(iso); if(isNaN(d)) return ""; var w="日一二三四五六"[d.getDay()];
  return (d.getMonth()+1).toString().padStart(2,"0")+"/"+d.getDate().toString().padStart(2,"0")+" 週"+w; }
function fmtShort(iso){ var d=new Date(iso); if(isNaN(d)) return "—"; return (d.getMonth()+1)+"/"+d.getDate(); }
function lastIn(it){ return (it.transactions||[]).slice().filter(function(t){return t.type==="in";})
  .sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0]; }
function lastOut(it){ return (it.transactions||[]).slice().filter(function(t){return t.type==="out";})
  .sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0]; }
function usage(it){
  var outs=(it.transactions||[]).filter(function(t){return t.type==="out"&&t.date;})
    .sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  if(outs.length<2) return null;
  var days=0, qty=0;
  for(var i=0;i<outs.length-1;i++){
    var gap=(new Date(outs[i+1].date)-new Date(outs[i].date))/DAY, q=num(outs[i].qty);
    if(gap>0&&q>0){ days+=gap; qty+=q; }
  }
  if(qty<=0) return null;
  var per=days/qty, last=new Date(outs[outs.length-1].date);
  var left=Math.max(stock(it)-num(it.threshold)+1,0);
  return { per:per, left:Math.round(per*Math.max(stock(it),0)), predict:new Date(last.getTime()+per*left*DAY), n:outs.length };
}
// 依照 usage() 算出的平均消耗速度（per：平均每 1 個能用幾天），從「最後一次記錄用掉」
// 那天往後推算：手上還有幾個庫存（都還沒開始用）就再加幾個 per，最後 +1 個 per 是「當下
// 正在用的這一個／剛用完準備要補的那一個」。這樣不管現在庫存是 0 還是還有幾個，都能推出
// 一個預估見底日——即使庫存已經歸零、好一陣子沒再記錄，也是以「上次用掉」那天為起點往後推，
// 而不是以「現在」往後推（現在往後推的話，如果好幾天沒開 App，估出來的天數會偏少）。
// usage() 回傳 null（用量紀錄不足，少於 2 筆「使用」紀錄）時這裡也回傳 null。
function restockAdvice(it){
  var u=usage(it); if(!u) return null;
  var lo=lastOut(it); if(!lo) return null;
  var units=Math.max(stock(it),0)+1;
  var eta=new Date(new Date(lo.date).getTime()+u.per*units*DAY);
  return { days:Math.round((eta.getTime()-Date.now())/DAY), eta:eta };
}
// 採購清單排序用：能算出預估見底日的，日期越近（或已經超過，days 是負的）排越前面；
// 完全沒庫存但連預估都抓不出來的（用量紀錄不足），視為最緊急，排最前面；
// 還有庫存、但抓不出用量的，排最後面（不確定，不能亂排在別人前面）。
function restockSortKey(it){
  var adv=restockAdvice(it);
  if(adv) return adv.days;
  return stock(it)<=0 ? -Infinity : Infinity;
}
function costStats(it){
  var ins=(it.transactions||[]).filter(function(t){return t.type==="in"&&num(t.price)>0;});
  if(!ins.length) return null;
  var avg=ins.reduce(function(a,t){return a+num(t.price);},0)/ins.length;
  var per=null, amt=ins.filter(function(t){return num(t.amount)>0;});
  if(amt.length){
    var tp=amt.reduce(function(a,t){return a+num(t.price);},0), ta=amt.reduce(function(a,t){return a+num(t.amount);},0);
    if(ta>0) per={ v:tp/ta, u:amt[0].amountUnit||"單位" };
  }
  return { n:ins.length, avg:avg, per:per };
}
function catsToRows(map){
  var rows=[];
  Object.keys(map||{}).forEach(function(k){
    var subs=map[k]||[];
    if(!subs.length) rows.push({category1:k,category2:""});
    else subs.forEach(function(s){ rows.push({category1:k,category2:s}); });
  });
  return rows;
}
function rowsToCats(rows){
  var map={};
  (rows||[]).forEach(function(r){
    var a=r&&r.category1; if(!a) return;
    if(!map[a]) map[a]=[];
    if(r.category2 && map[a].indexOf(r.category2)===-1) map[a].push(r.category2);
  });
  return map;
}
function upgrade(it){
  if(Array.isArray(it.transactions)) return it;
  var tx=[], q=typeof it.quantity==="number"?it.quantity:0;
  if(q>0) tx.push({id:uid(),type:"in",date:nowISO(),qty:q,spec:"期初庫存（資料升級）"});
  var out={}; Object.keys(it).forEach(function(k){ if(k!=="quantity"&&k!=="purchases") out[k]=it[k]; });
  out.transactions=tx; return out;
}

/* ── state ─────────────────────────────────────────── */
function ls(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
var S = {
  items:null, cats:{}, status:"loading", error:"",
  url: ls("appsScriptUrl", DEFAULT_URL), pw: ls("accessPassword",""),
  pwInput:"", pwError:false, urlInput:"",
  tab:"stock", cat:"全部", search:"", logFilter:"全部",
  detailId:null, countOpen:false, countVal:"",
  buy:null, add:null, edit:null, txEdit:null,
  bought:{}, toast:"", catMgr:false
};
var syncing=false, loading=false, toastT=null;

function toast(m){ S.toast=m; clearTimeout(toastT); toastT=setTimeout(function(){ S.toast=""; render(); },1900); render(); }
function set(patch){ Object.keys(patch).forEach(function(k){ S[k]=patch[k]; }); render(); }

/* ── network ───────────────────────────────────────────────────────
 * 不再每次存檔都把整包 items 送到後端整表重寫，而是把每個操作記成一筆
 * 「差異」（op），累積在 opsQueue 裡，flush() 時把目前排隊的 ops 一次送出，
 * 後端只針對真正變動的那幾列做新增/更新/刪除。
 * ------------------------------------------------------------------ */
var opsQueue=[]; // 尚未成功同步到後端的差異

// fullResync：目前這批 ops 尚未送出前，狀態已經被之後的完整快照涵蓋，之前排的都可以丟棄。
// categoriesSet：分類架構的異動只保留「最新的一份完整快照」即可，不需要疊加多筆。
function queueOp(op){
  if(op.op==="fullResync"){ opsQueue=[op]; return; }
  if(op.op==="categoriesSet"){ opsQueue=opsQueue.filter(function(o){ return o.op!=="categoriesSet"; }); }
  opsQueue.push(op);
}
function sync(){ flush(); }

function load(){
  if(loading || !S.url || !S.pw) return;
  loading=true; S.status="loading"; render();
  var u=new URL(S.url); u.searchParams.set("token", S.pw||"");
  fetch(u.toString()).then(function(r){ if(!r.ok) throw new Error("load"); return r.json(); })
  .then(function(j){
    if(j && j.ok===false) { var e=new Error(j.error||"load"); e.code=j.error; throw e; }
    S.items=(Array.isArray(j.items)?j.items:[]).map(upgrade);
    S.cats=rowsToCats(Array.isArray(j.categories)?j.categories:[]);
    S.status="ready";
    opsQueue=[]; // 剛讀到伺服器最新狀態，沒有還沒送出的差異
  })
  .catch(function(e){
    if(e && e.code==="unauthorized"){ try{ localStorage.removeItem("accessPassword"); }catch(x){} S.pw=""; S.pwError=true; S.status="auth"; }
    else S.status="error";
  })
  .finally(function(){ loading=false; render(); });
}
function flush(){
  if(syncing || opsQueue.length===0) return;
  if(S.status!=="ready" || !S.url || !S.pw) return;
  var job=opsQueue; opsQueue=[]; syncing=true;
  fetch(S.url,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ ops:job, token:S.pw }) })
  .then(function(r){ if(!r.ok) throw new Error("save"); return r.json(); })
  .then(function(j){ if(j && j.ok===false){ var e=new Error(j.error||"save"); e.code=j.error; throw e; } })
  .catch(function(e){
    // 送失敗就把這批 ops 補回佇列最前面（用 queueOp 重新過一次，保留 fullResync/categoriesSet 的去重規則）
    var rest=opsQueue; opsQueue=[]; job.concat(rest).forEach(queueOp);
    if(e && e.code==="unauthorized"){ try{ localStorage.removeItem("accessPassword"); }catch(x){} S.pw=""; S.status="auth"; render(); }
    else toast("同步失敗，稍後會再試");
  })
  .finally(function(){ syncing=false; if(opsQueue.length>0) flush(); });
}

function item(id){ return (S.items||[]).find(function(i){ return i.id===id; }); }
function itemFields(it){
  return { id:it.id, name:it.name, category:it.category, unit:it.unit, threshold:it.threshold,
    barcode:it.barcode||"", category2:it.category2||"", brand:it.brand||"" };
}
function patchItem(id, fn){
  S.items=(S.items||[]).map(function(i){ return i.id===id ? fn(i) : i; });
}
function addTx(id, tx){
  tx.id=uid(); if(!tx.date) tx.date=nowISO();
  patchItem(id, function(i){ return Object.assign({}, i, { transactions:[tx].concat(i.transactions||[]) }); });
  queueOp({ op:"txAdd", itemId:id, tx:tx });
  sync();
}
function bump(id, delta){
  var it=item(id); if(!it) return;
  if(delta<0 && stock(it)<=0) return;
  addTx(id,{ type: delta>0?"in":"out", qty:Math.abs(delta) });
  toast(delta>0 ? it.name+" ＋1 "+(it.unit||"") : it.name+" 用掉 1 "+(it.unit||""));
  render();
}

      '<div class="two"><div><div class="lbl">總容量（選填）</div><input class="inp" type="number" inputmode="decimal" data-bind="buy.amount" value="'+esc(b.amount)+'" placeholder="例如 500"></div>'+
        '<div><div class="lbl">容量單位</div><input class="inp" data-bind="buy.amountUnit" value="'+esc(b.amountUnit)+'" placeholder="ml／g／入"></div></div>'+
      '<div><div class="lbl">備註（選填）</div><input class="inp" data-bind="buy.note" value="'+esc(b.note)+'" placeholder="例如 特價"></div>'+
      '<div class="two" style="margin-top:2px"><button class="sb" data-act="closeBuy">取消</button><button class="pb" data-act="saveBuy">儲存</button></div>'+
    '</div></div></div>';
}
function addSheet(){
  var a=S.add, f=a.form, titles={1:"這是什麼東西？",2:"現在有幾個？",3:"這次買了多少錢？"};
  var subs=(S.cats[f.category]||[]);
  var h='<div class="sheet" data-backdrop="1" data-act="closeAdd"><div class="pane" data-stop="1"><div class="grab"></div>'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--accent-800)">步驟 '+a.step+' / 3</div>'+
      '<div style="font-size:22px;font-weight:900;line-height:1.25;margin-top:2px">'+titles[a.step]+'</div></div>'+
      '<div style="display:flex;gap:5px">'+[1,2,3].map(function(n){ return '<span class="dot'+(n<=a.step?" on":"")+'"></span>'; }).join("")+'</div>'+
    '</div><div class="pbody" style="margin-top:16px">';
  if(a.step===1){
    h+='<div><div class="lbl">品項名稱</div><input class="inp" data-bind="add.form.name" value="'+esc(f.name)+'" placeholder="例如 洗碗精"></div>'+
      '<div><div class="lbl">品牌（選填）</div><input class="inp" data-bind="add.form.brand" value="'+esc(f.brand)+'" placeholder="例如 花仙子"></div>'+
      '<div><div class="lbl">分類</div>'+chips(catKeys().map(function(c){return {value:c,label:c};}), f.category, "addCat1")+
      '<button class="chip" style="margin-top:7px" data-act="addCat">＋ 新增分類</button></div>'+
      (subs.length?'<div><div class="lbl">子分類（選填）</div>'+chips(subs.map(function(c){return {value:c,label:c};}), f.category2, "addCat2pick")+'</div>':'');
  } else if(a.step===2){
    h+='<div><div class="lbl">單位</div>'+chips(UNITS.map(function(u){return {value:u,label:u};}), f.unit, "addUnit")+'</div>'+
      '<div><div class="lbl">現在有幾'+esc(f.unit||"個")+'</div><input class="inp" type="number" inputmode="numeric" data-bind="add.form.qty" value="'+esc(f.qty)+'"></div>'+
      '<div><div class="lbl">警戒值</div><input class="inp" type="number" inputmode="numeric" data-bind="add.form.threshold" value="'+esc(f.threshold)+'">'+
      '<div class="hint">庫存低於這個數量，就會列進採購清單。</div></div>';
  } else {
    h+='<div style="font-size:13px;color:var(--soft);line-height:1.7;margin-top:-4px">這一段都可以先跳過，之後記進貨時再補。</div>'+
      '<div><div class="lbl">這次花費</div><input class="inp" type="number" inputmode="decimal" data-bind="add.form.price" value="'+esc(f.price)+'" placeholder="例如 120"></div>'+
      '<div><div class="lbl">購買管道</div>'+chips(channelList().map(function(c){return {value:c,label:c};}), f.channel, "addCh")+'</div>'+
      '<div class="two"><div><div class="lbl">總容量</div><input class="inp" type="number" inputmode="decimal" data-bind="add.form.amount" value="'+esc(f.amount)+'" placeholder="例如 500"></div>'+
      '<div><div class="lbl">容量單位</div><input class="inp" data-bind="add.form.amountUnit" value="'+esc(f.amountUnit)+'" placeholder="ml／g／入"></div></div>'+
      '<div><div class="lbl">條碼（選填）</div><input class="inp" data-bind="add.form.barcode" value="'+esc(f.barcode)+'" placeholder="手動輸入條碼數字"></div>';
  }
  h+='<div class="two" style="margin-top:2px"><button class="sb" data-act="addBack">'+(a.step===1?"取消":"上一步")+'</button>'+
     '<button class="pb" data-act="addNext">'+(a.step===3?"完成新增":"下一步")+'</button></div>'+
  '</div></div></div>';
  return h;
}
function editSheet(){
  var e=S.edit, subs=(S.cats[e.category]||[]);
  return '<div class="sheet" data-backdrop="1" data-act="closeEdit"><div class="pane" data-stop="1"><div class="grab"></div>'+
    '<div style="font-size:22px;font-weight:900;margin-bottom:14px">編輯品項</div><div class="pbody">'+
    '<div><div class="lbl">品項名稱</div><input class="inp" data-bind="edit.name" value="'+esc(e.name)+'"></div>'+
    '<div><div class="lbl">品牌</div><input class="inp" data-bind="edit.brand" value="'+esc(e.brand)+'"></div>'+
    '<div><div class="lbl">分類</div>'+chips(catKeys().map(function(c){return {value:c,label:c};}), e.category, "editCat1")+'</div>'+
    (subs.length?'<div><div class="lbl">子分類</div>'+chips(subs.map(function(c){return {value:c,label:c};}), e.category2, "editCat2")+'</div>':'')+
    '<div class="two"><div><div class="lbl">單位</div><input class="inp" data-bind="edit.unit" value="'+esc(e.unit)+'"></div>'+
      '<div><div class="lbl">警戒值</div><input class="inp" type="number" inputmode="numeric" data-bind="edit.threshold" value="'+esc(e.threshold)+'"></div></div>'+
    '<div><div class="lbl">條碼</div><input class="inp" data-bind="edit.barcode" value="'+esc(e.barcode)+'"></div>'+
    '<div class="two" style="margin-top:2px"><button class="sb" data-act="closeEdit">取消</button><button class="pb" data-act="saveEdit">儲存</button></div>'+
  '</div></div></div>';
}
function txSheet(){
  var t=S.txEdit;
  return '<div class="sheet" data-backdrop="1" data-act="closeTx"><div class="pane" data-stop="1"><div class="grab"></div>'+
    '<div style="font-size:22px;font-weight:900">'+(t.type==="in"?"進貨紀錄":"使用紀錄")+'</div>'+
    '<div style="font-size:13px;color:var(--soft);margin:3px 0 14px">'+esc(t.itemName)+'・'+esc(fmtD(t.date))+'</div>'+
    '<div class="pbody">'+
    '<div class="two"><div><div class="lbl">數量</div><input class="inp" type="number" inputmode="numeric" data-bind="txEdit.qty" value="'+esc(t.qty)+'"></div>'+
      '<div><div class="lbl">日期</div><input class="inp" type="date" data-bind="txEdit.day" value="'+esc(t.day)+'"></div></div>'+
    (t.type==="in"?'<div><div class="lbl">花費</div><input class="inp" type="number" inputmode="decimal" data-bind="txEdit.price" value="'+esc(t.price)+'"></div>'+
      '<div><div class="lbl">通路</div>'+chips(channelList().map(function(c){return {value:c,label:c};}), t.channel, "txCh")+'</div>':'')+
    '<div><div class="lbl">備註</div><input class="inp" data-bind="txEdit.note" value="'+esc(t.note)+'"></div>'+
    '<div class="two" style="margin-top:2px"><button class="sb danger" data-act="delTx">刪除這筆</button><button class="pb" data-act="saveTx">儲存</button></div>'+
  '</div></div></div>';
}
function channelList(){
  var set={}; CHANNELS.forEach(function(c){ set[c]=1; });
  (S.items||[]).forEach(function(i){ (i.transactions||[]).forEach(function(t){ if(t.channel) set[t.channel]=1; }); });
  return Object.keys(set);
}

/* ── render ────────────────────────────────────────── */
function render(){
  var root=document.getElementById("root"), h="";
  var active=document.activeElement, bind=active&&active.getAttribute?active.getAttribute("data-bind"):null;
  var caret=bind&&active.setSelectionRange?[active.selectionStart,active.selectionEnd]:null;

  if(!S.pw){ h=loginScreen(); }
  else if(S.status==="loading"){ h='<div class="app"><div class="center"><div class="logo">'+svg("cab",34)+'</div><div class="h1">連線到 Google Sheet</div><div style="font-size:14px;color:var(--soft)">正在讀取庫存資料…</div></div></div>'; }
  else if(S.status==="auth"){ h=loginScreen(); }
  else if(S.status==="error"){ h=connScreen(); }
  else {
    var body = S.tab==="buy" ? buyScreen() : S.tab==="log" ? logScreen() : S.tab==="set" ? setScreen() : stockScreen();
    h='<div class="app">'+body+nav()+'</div>';
    if(S.detailId) h+=detailSheet();
    if(S.buy) h+=buySheet();
    if(S.add) h+=addSheet();
    if(S.edit) h+=editSheet();
    if(S.txEdit) h+=txSheet();
  }
  if(S.toast) h+='<div class="toast"><b>'+esc(S.toast)+'</b></div>';
  root.innerHTML=h;

  if(bind){
    var el=root.querySelector('[data-bind="'+bind+'"]');
    if(el){ el.focus(); if(caret&&el.setSelectionRange){ try{ el.setSelectionRange(caret[0],caret[1]); }catch(e){} } }
  }
}

/* ── input binding ─────────────────────────────────── */
function setPath(path, val){
  var parts=path.split("."), o=S;
  for(var i=0;i<parts.length-1;i++){ o=o[parts[i]]; if(!o) return; }
  o[parts[parts.length-1]]=val;
}
document.addEventListener("input", function(e){
  var el=e.target, p=el.getAttribute&&el.getAttribute("data-bind");
  if(!p) return;
  setPath(p, el.value);
  if(p==="search") render();
});
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter") return;
  var p=e.target.getAttribute&&e.target.getAttribute("data-bind");
  if(p==="pwInput") act("login");
  if(p==="urlInput") act("saveUrl");
});

/* ── actions ───────────────────────────────────────── */
var A = {
  login:function(){
    var v=(S.pwInput||"").trim(); if(!v){ S.pwError=true; return render(); }
    try{ localStorage.setItem("accessPassword", v); }catch(e){}
    S.pw=v; S.pwInput=""; S.pwError=false; S.status="loading"; render(); load();
  },
  logout:function(){ try{ localStorage.removeItem("accessPassword"); }catch(e){} S.pw=""; S.items=null; S.tab="stock"; render(); },
  saveUrl:function(){
    var v=(S.urlInput||"").trim(); if(!v) return;
    try{ localStorage.setItem("appsScriptUrl", v); }catch(e){}
    S.url=v; S.urlInput=""; load();
  },
  retry:function(){ load(); },
  tab:function(el){ S.tab=el.getAttribute("data-v"); render(); },
  setCat:function(el){ S.cat=el.getAttribute("data-v"); render(); },
  setLogFilter:function(el){ S.logFilter=el.getAttribute("data-v"); render(); },
  clearSearch:function(){ S.search=""; render(); },
  inc:function(el){ bump(el.getAttribute("data-id"), 1); },
  dec:function(el){ bump(el.getAttribute("data-id"), -1); },
  detail:function(el){ var id=el.getAttribute("data-id"); S.detailId=id; S.countOpen=false; S.countVal=String(stock(item(id))); render(); },
  closeDetail:function(){ S.detailId=null; S.countOpen=false; render(); },
  toggleCount:function(){ S.countOpen=!S.countOpen; render(); },
  applyCount:function(){
    var it=item(S.detailId); if(!it) return;
    var n=Math.max(0, Math.round(num(S.countVal))), q=stock(it), d=n-q;
    if(d!==0) addTx(it.id, { type: d>0?"in":"out", qty:Math.abs(d), spec:"盤點調整" });
    S.countOpen=false; toast("已調整為 "+n+" "+(it.unit||"")); render();
  },
  delItem:function(el){
    var id=el.getAttribute("data-id"), it=item(id); if(!it) return;
    if(!confirm("確定要刪除「"+it.name+"」嗎？紀錄也會一起移除。")) return;
    S.items=(S.items||[]).filter(function(i){ return i.id!==id; });
    queueOp({ op:"itemDelete", id:id }); sync();
    S.detailId=null; toast("已刪除 "+it.name); render();
  },
  toggleBought:function(el){ var id=el.getAttribute("data-id"); S.bought[id]=!S.bought[id]; render(); },
  openBuy:function(el){
    var id=el.getAttribute("data-id"), it=item(id), li=lastIn(it)||{};
    S.buy={ itemId:id, qty:Math.max(1, num(el.getAttribute("data-q"))||1), price:"", channel:li.channel||CHANNELS[0],
      amount:li.amount?String(li.amount):"", amountUnit:li.amountUnit||"", note:"" };
    render();
  },
  closeBuy:function(){ S.buy=null; render(); },
  buyQty:function(el){ S.buy.qty=Math.max(1, S.buy.qty + num(el.getAttribute("data-v"))); render(); },
  buyCh:function(el){ S.buy.channel=el.getAttribute("data-v"); render(); },
  saveBuy:function(){
    var b=S.buy, it=item(b.itemId); if(!it) return;
    addTx(it.id, { type:"in", qty:b.qty, price:num(b.price)||"", channel:b.channel||"",
      amount:num(b.amount)||"", amountUnit:b.amountUnit||"", note:b.note||"" });
    S.bought[it.id]=true; S.buy=null; toast("已記一筆進貨"); render();
  },
  openAdd:function(){
    S.add={ step:1, form:{ name:"", brand:"", category:catKeys()[0]||"日用品", category2:"", unit:"瓶",
      qty:"1", threshold:"1", price:"", channel:CHANNELS[0], amount:"", amountUnit:"", barcode:"" } };
    render();
  },
  closeAdd:function(){ S.add=null; render(); },
  addBack:function(){ if(S.add.step===1){ S.add=null; } else { S.add.step--; } render(); },
  addNext:function(){
    var a=S.add, f=a.form;
    if(a.step===1 && !(f.name||"").trim()) return toast("請先填品項名稱");
    if(a.step<3){ a.step++; return render(); }
    var q=Math.max(0, Math.round(num(f.qty)));
    var tx=[];
    if(q>0) tx.push({ id:uid(), type:"in", date:nowISO(), qty:q, price:num(f.price)||"", channel:f.channel||"",
      amount:num(f.amount)||"", amountUnit:f.amountUnit||"", spec:"期初庫存" });
    var it={ id:uid(), name:(f.name||"").trim(), brand:(f.brand||"").trim(), category:f.category, category2:f.category2||"",
      unit:f.unit||"個", threshold:Math.max(0, Math.round(num(f.threshold))), barcode:(f.barcode||"").trim(), transactions:tx };
    S.items=(S.items||[]).concat([it]);
    var newCat=false;
    if(!S.cats[it.category]) { S.cats[it.category]=[]; newCat=true; }
    queueOp({ op:"itemAdd", item:it });
    if(newCat) queueOp({ op:"categoriesSet", rows:catsToRows(S.cats) });
    sync();
    S.add=null; toast("已新增 "+it.name); render();
  },
  addCat1:function(el){ S.add.form.category=el.getAttribute("data-v"); S.add.form.category2=""; render(); },
  addCat2pick:function(el){ var v=el.getAttribute("data-v"); S.add.form.category2 = S.add.form.category2===v?"":v; render(); },
  addUnit:function(el){ S.add.form.unit=el.getAttribute("data-v"); render(); },
  addCh:function(el){ S.add.form.channel=el.getAttribute("data-v"); render(); },
  openEdit:function(el){
    var it=item(el.getAttribute("data-id")); if(!it) return;
    S.edit={ id:it.id, name:it.name||"", brand:it.brand||"", category:it.category||"", category2:it.category2||"",
      unit:it.unit||"", threshold:String(num(it.threshold)), barcode:it.barcode||"" };
    render();
  },
  closeEdit:function(){ S.edit=null; render(); },
  editCat1:function(el){ S.edit.category=el.getAttribute("data-v"); S.edit.category2=""; render(); },
  editCat2:function(el){ var v=el.getAttribute("data-v"); S.edit.category2 = S.edit.category2===v?"":v; render(); },
  saveEdit:function(){
    var e=S.edit;
    if(!(e.name||"").trim()) return toast("品項名稱不能空白");
    patchItem(e.id, function(i){ return Object.assign({}, i, { name:e.name.trim(), brand:e.brand.trim(),
      category:e.category, category2:e.category2, unit:e.unit||"個",
      threshold:Math.max(0,Math.round(num(e.threshold))), barcode:(e.barcode||"").trim() }); });
    queueOp({ op:"itemUpdate", item:itemFields(item(e.id)) }); sync();
    S.edit=null; toast("已儲存"); render();
  },
  txEdit:function(el){
    var it=item(el.getAttribute("data-id")); if(!it) return;
    var t=(it.transactions||[]).find(function(x){ return x.id===el.getAttribute("data-tx"); }); if(!t) return;
    S.txEdit={ itemId:it.id, itemName:it.name, txId:t.id, type:t.type, date:t.date,
      day:(t.date||"").slice(0,10), qty:String(num(t.qty)), price:num(t.price)?String(num(t.price)):"",
      channel:t.channel||"", note:t.note||"" };
    render();
  },
  closeTx:function(){ S.txEdit=null; render(); },
  txCh:function(el){ S.txEdit.channel=el.getAttribute("data-v"); render(); },
  saveTx:function(){
    var e=S.txEdit, q=Math.max(0, Math.round(num(e.qty)));
    if(q<=0) return toast("數量要大於 0");
    var updatedTx=null;
    patchItem(e.itemId, function(i){
      return Object.assign({}, i, { transactions:(i.transactions||[]).map(function(t){
        if(t.id!==e.txId) return t;
        var d=e.day ? new Date(e.day+"T12:00:00").toISOString() : t.date;
        updatedTx=Object.assign({}, t, { qty:q, date:d, price:num(e.price)||"", channel:e.channel||"", note:e.note||"" });
        return updatedTx;
      }) });
    });
    if(updatedTx){ queueOp({ op:"txUpdate", itemId:e.itemId, tx:updatedTx }); sync(); }
    S.txEdit=null; toast("已儲存"); render();
  },
  delTx:function(){
    var e=S.txEdit;
    if(!confirm("刪除這筆紀錄？庫存會跟著重算。")) return;
    patchItem(e.itemId, function(i){ return Object.assign({}, i, { transactions:(i.transactions||[]).filter(function(t){ return t.id!==e.txId; }) }); });
    queueOp({ op:"txDelete", itemId:e.itemId, txId:e.txId }); sync();
    S.txEdit=null; toast("已刪除一筆紀錄"); render();
  },
  addCat:function(){
    var v=prompt("新增分類名稱："); if(!v||!v.trim()) return;
    v=v.trim(); if(!S.cats[v]) S.cats[v]=[];
    if(S.add) S.add.form.category=v;
    queueOp({ op:"categoriesSet", rows:catsToRows(S.cats) }); sync(); render();
  },
  // 改名會連動更新所有用到這個分類的品項，屬於一次影響多列的批次異動，
  // 這裡直接用 fullResync（整包 items+categories 的快照）處理，不特別拆成一堆 itemUpdate。
  renameCat:function(el){
    var c=el.getAttribute("data-v"), v=prompt("重新命名為：", c); if(!v||!v.trim()||v.trim()===c) return;
    v=v.trim();
    var subs=S.cats[c]||[]; delete S.cats[c];
    S.cats[v]=Array.from(new Set((S.cats[v]||[]).concat(subs)));
    S.items=(S.items||[]).map(function(i){ return i.category===c ? Object.assign({},i,{category:v}) : i; });
    if(S.cat===c) S.cat=v;
    queueOp({ op:"fullResync", items:S.items, categories:catsToRows(S.cats) }); sync(); render();
  },
  delCat:function(el){
    var c=el.getAttribute("data-v");
    if(!confirm("刪除分類「"+c+"」？（已使用這個分類的品項資料不受影響）")) return;
    delete S.cats[c]; if(S.cat===c) S.cat="全部";
    queueOp({ op:"categoriesSet", rows:catsToRows(S.cats) }); sync(); render();
  },
  addCat2:function(el){
    var c=el.getAttribute("data-v"), v=prompt("在「"+c+"」底下新增子分類："); if(!v||!v.trim()) return;
    S.cats[c]=Array.from(new Set((S.cats[c]||[]).concat([v.trim()])));
    queueOp({ op:"categoriesSet", rows:catsToRows(S.cats) }); sync(); render();
  },
  delCat2:function(el){
    var c=el.getAttribute("data-v"), s=el.getAttribute("data-v2");
    S.cats[c]=(S.cats[c]||[]).filter(function(x){ return x!==s; });
    queueOp({ op:"categoriesSet", rows:catsToRows(S.cats) }); sync(); render();
  }
};
function act(name, el){ if(A[name]) A[name](el||document.createElement("div")); }

document.addEventListener("click", function(e){
  var hit=e.target.closest("[data-act]");
  if(!hit) return;
  var name=hit.getAttribute("data-act");
  // backdrops close their sheet only when the backdrop itself is clicked
  if(hit.hasAttribute("data-backdrop") && e.target!==hit) return;
  e.preventDefault();
  if(A[name]) A[name](hit);
});

render();
if(S.pw) load();
})();
</script>
</body>
</html>
